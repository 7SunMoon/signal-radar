name: Daily Signal Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Build daily radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          OPENAI_API_STYLE: ${{ vars.OPENAI_API_STYLE || 'auto' }}
          OPENAI_STRUCTURED_OUTPUT: ${{ vars.OPENAI_STRUCTURED_OUTPUT || 'auto' }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          RADAR_TIMEZONE: Asia/Shanghai
        run: |
          python scripts/daily_pipeline.py
          npm run build

      - name: Save new digest
        run: |
          if git diff --quiet -- data/daily; then exit 0; fi
          git config user.name "signal-radar-bot"
          git config user.email "signal-radar-bot@users.noreply.github.com"
          git add data/daily
          git commit -m "data: update daily radar"
          git push
